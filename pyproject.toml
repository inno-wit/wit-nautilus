[project]
name = "wit-nautilus"
version = "0.1.0"
description = "Wit Hedge Fund's LLM committee + risk pipeline, ported to NautilusTrader over Interactive Brokers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# nautilus_trader==1.230.0 confirmed installable + IB adapter importable on this machine
# (Python 3.13, Windows) during Phase N0's static-inspection pass. Pinned to that exact
# version until a deliberate upgrade, since adapter config field names are load-bearing.
ib = [
    "nautilus_trader[ib]==1.230.0",
    "anthropic>=0.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "arch>=6.3",
    "scipy>=1.11",
    "yfinance>=0.2",
]
research = [
    "vectorbt",
    "jupyter",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wit"]

[project.scripts]
wit = "wit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
