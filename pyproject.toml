[project]
name = "wit-nautilus"
version = "0.1.0"
description = "Wit Hedge Fund's LLM committee + risk pipeline, ported to NautilusTrader over Interactive Brokers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase N2: the deterministic quant desks (wit/desks/) — pure pandas/numpy/arch over
# OHLCV, zero broker or LLM coupling.
quant = [
    "pandas>=2.0",
    "numpy>=1.26",
    "arch>=6.3",
    "scipy>=1.11",
    "yfinance>=0.2",
]
# Phase N3: the LLM committee client.
committee = [
    "anthropic>=0.40",
]
# nautilus_trader==1.230.0 confirmed installable + IB adapter importable on this machine
# (Python 3.13, Windows) during Phase N0's static-inspection pass. Pinned to that exact
# version until a deliberate upgrade, since adapter config field names are load-bearing.
ib = [
    "nautilus_trader[ib]==1.230.0",
    "wit-nautilus[quant]",
    "wit-nautilus[committee]",
]
research = [
    "vectorbt",
    "jupyter",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "wit-nautilus[quant]",
    "wit-nautilus[committee]",
    # Phase N5: wit/nautilus/{strategy,actor}.py and their tests (including a real
    # BacktestEngine smoke test) need core nautilus_trader - not the [ib] extra's
    # adapter/ibapi weight, which nothing in this test suite exercises yet (that
    # lands with Phase N6).
    "nautilus_trader==1.230.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wit"]

[project.scripts]
wit = "wit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
