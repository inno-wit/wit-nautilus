[project]
name = "wit-nautilus"
version = "0.1.0"
description = "Wit Hedge Fund's LLM committee + risk pipeline, ported to NautilusTrader over Alpaca (execution) + Polygon (data)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase N2: the deterministic quant desks (wit/desks/) — pure pandas/numpy/arch over
# OHLCV, zero broker or LLM coupling.
quant = [
    "pandas>=2.0",
    "numpy>=1.26",
    "arch>=6.3",
    "scipy>=1.11",
    "yfinance>=0.2",
]
# Phase N3: the LLM committee client.
committee = [
    "anthropic>=0.40",
]
# nautilus_trader==1.230.0 confirmed installable on this machine (Python 3.13, Windows)
# during Phase N0's static-inspection pass. Pinned to that exact version until a
# deliberate upgrade, since adapter config field names are load-bearing.
#
# Broker/data swap (docs/whatif-we-used-alpaca-quirky-aurora.md): IB replaced by a
# three-way split - Alpaca (execution, paper), Polygon (bars, REST-polled on the
# free/delayed tier), Alpha Vantage (enrichment, already optional via IntelConfig).
# No official NautilusTrader adapter exists for either Alpaca or Polygon (unlike IB,
# which shipped in nautilus_trader[ib]) - wit/adapters/{alpaca,polygon}/ are private,
# in-repo LiveExecutionClient/LiveMarketDataClient implementations. Alpaca uses the
# official alpaca-py SDK; Polygon uses plain REST (urllib, matching market_intel.py's
# existing Finnhub pattern) rather than an unverified "massive-com/client-python"
# package name, since the free tier is REST-polled anyway (no WS entitlement).
alpaca = [
    "alpaca-py>=0.33",
    "nautilus_trader==1.230.0",
    "wit-nautilus[quant]",
    "wit-nautilus[committee]",
]
polygon = [
    "nautilus_trader==1.230.0",
    "wit-nautilus[quant]",
    "wit-nautilus[committee]",
]
research = [
    "vectorbt",
    "jupyter",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "wit-nautilus[quant]",
    "wit-nautilus[committee]",
    # Phase N5: wit/nautilus/{strategy,actor}.py and their tests (including a real
    # BacktestEngine smoke test) need core nautilus_trader - not the [alpaca] extra's
    # alpaca-py weight, which the adapter's own mock-server tests exercise separately.
    "nautilus_trader==1.230.0",
    "alpaca-py>=0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wit"]

[project.scripts]
wit = "wit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
