# Phase N8. Two services on one private bridge network: ib-gateway (the broker
# connection) and fund (this repo, running `wit paper`). Neither publishes an API port to
# the host - fund reaches ib-gateway by its Compose service name on the internal network
# only, matching the build plan's "4002 exposed only on an internal network". The one
# published port is VNC, loopback-bound, for one-time paper-account login/2FA over an SSH
# tunnel (`ssh -L 5900:127.0.0.1:5900 user@vps`, then point a VNC client at
# localhost:5900) - never expose it beyond 127.0.0.1.
#
# Bring up: docker compose -f docker/compose.yml up -d
# Logs:     docker compose -f docker/compose.yml logs -f fund
# Stop:     docker compose -f docker/compose.yml down          (data/ is a bind mount, survives)
#
# Before first `up`, read this file's env var comments and populate ../.env from
# ../.env.example - in particular TWS_USERID/TWS_PASSWORD/VNC_SERVER_PASSWORD (ib-gateway's
# own login, distinct from wit's ANTHROPIC_API_KEY/TWS_ACCOUNT/etc) and IBG_HOST=ib-gateway/
# IBG_PORT=4002 (NOT the 127.0.0.1:7497 defaults .env.example ships for local TWS dev).

services:
  ib-gateway:
    # :stable floats. Pin by digest before any real deployment - after the first
    # `docker compose pull`, run:
    #   docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/gnzsnz/ib-gateway:stable
    # and replace the line below with `image: ghcr.io/gnzsnz/ib-gateway@sha256:<digest>`.
    # A floating tag on a container that logs into a real (paper) brokerage account is
    # exactly the kind of surprise-upgrade risk digest pinning exists to close.
    image: ghcr.io/gnzsnz/ib-gateway:stable
    # TWS_USERID/TWS_PASSWORD/VNC_SERVER_PASSWORD come from ../.env (this is the
    # gateway's own IBKR login, distinct from wit's own ANTHROPIC_API_KEY/TWS_ACCOUNT/
    # etc - both live in the same .env file for one place to manage secrets on the VPS).
    # Leave VNC_SERVER_PASSWORD unset in .env once the initial paper-account login/2FA is
    # done - it's one more credential to rotate otherwise, for a feature only needed once.
    env_file: ../.env
    environment:
      TRADING_MODE: paper
      TIME_ZONE: UTC
      TWOFA_TIMEOUT_ACTION: restart
      READ_ONLY_API: "no"
    ports:
      - "127.0.0.1:5900:5900"   # VNC - loopback only, reach over an SSH tunnel
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      # The image ships no healthcheck of its own (confirmed against its README) - probe
      # the paper API port directly. bash's /dev/tcp avoids depending on curl/nc being
      # present in this particular image.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4002' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s   # IBC + TWS cold start is slow, especially on first run
      retries: 5

  fund:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      ib-gateway:
        condition: service_healthy
    env_file: ../.env
    environment:
      # Override .env.example's local-TWS-on-Windows defaults (127.0.0.1:7497) - inside
      # Compose, ib-gateway is reached by its service name, on its paper port.
      IBG_HOST: ib-gateway
      IBG_PORT: "4002"
    volumes:
      - ../data:/app/data   # journal, dream state, kill switch - the one stateful volume
                            # that matters; back it up nightly (see backup-data.sh)
    networks: [internal]
    restart: unless-stopped
    command: ["paper"]

networks:
  internal:
    driver: bridge
