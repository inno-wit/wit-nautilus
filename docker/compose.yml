# Broker swap (docs/whatif-we-used-alpaca-quirky-aurora.md): the Phase N8
# ib-gateway service is gone entirely. Alpaca (execution) and Polygon (data)
# are both pure outbound HTTPS/WSS to third-party clouds - no local gateway
# container, no inbound-facing port, no VNC/2FA login step. `fund` is the only
# service now; it needs no `depends_on` and no `networks:` (nothing else on
# this host for it to reach).
#
# Bring up: docker compose -f docker/compose.yml up -d
# Logs:     docker compose -f docker/compose.yml logs -f fund
# Stop:     docker compose -f docker/compose.yml down          (data/ is a bind mount, survives)
#
# Before first `up`: populate ../.env from ../.env.example with real
# ALPACA_API_KEY/ALPACA_SECRET_KEY/POLYGON_API_KEY (and ALPHAVANTAGE_API_KEY if
# enrichment is wanted) - there is no second gitignored env file to worry
# about, unlike the old ib-gateway.env split (Phase N8 audit finding L2 doesn't
# apply here: Alpaca/Polygon secrets are wit's own, not a third-party image's).
# Match FUND_UID (below) to your deploy user's real uid - `id -u` - or the fund
# container won't be able to write data/ (Phase N8 audit finding M2;
# vps-setup.sh deliberately doesn't create the deploy user, so its uid isn't
# knowable ahead of time here).

services:
  fund:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Must match the deploy user's real uid (`id -u`) or the container's non-root
        # `wit` user can't write ../data, which is bind-mounted with the HOST's ownership
        # (Phase N8 audit finding M2) - including, critically, the kill switch. A safety
        # mechanism that can't write its own halt file because of a uid mismatch is worse
        # than no mechanism, since it looks like it's there. vps-setup.sh prints the
        # deploy user's uid as part of its own closing instructions.
        FUND_UID: "${FUND_UID:-1000}"
    env_file: ../.env
    volumes:
      - ../data:/app/data   # journal, dream state, kill switch - the one stateful volume
                            # that matters; back it up nightly (see backup-data.sh)
    restart: unless-stopped
    command: ["paper"]
